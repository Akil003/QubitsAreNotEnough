name: Validate manuscript

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Verify manifested artefacts
        run: sha256sum -c MANIFEST.sha256

      - name: Reject stale submission PDF
        run: |
          if grep -q '^STATUS: STALE' PDF_PREFLIGHT.txt; then
            echo "PDF_PREFLIGHT.txt is stale; rebuild the submission PDFs."
            exit 1
          fi

      - name: Run deterministic validation suite
        run: python validate_outputs.py
